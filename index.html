<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de Multiplication</title>

<style>
body {
    margin: 0;
    font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
        url("background.png") center center / cover no-repeat;
    background-attachment: scroll;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 120px;
    text-align: center;
}

@media (min-width: 768px) {
    body { background-attachment: fixed; }
}

.screen {
    display: none;
    max-width: 92%;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(2px);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    color: #f5f5f5;
}

.game-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 18px;
    font-weight: bold;
}

h1, h2, #game {
    color: #f5f5f5;
    text-shadow:
        1px 1px 0 rgba(255,255,255,0.15),
        -1px -1px 0 rgba(255,255,255,0.1);
}

#game {
    font-size: 44px;
    letter-spacing: 2px;
}

#answer {
    font-size: 44px;
    width: 120px;
    border: none;
    border-bottom: 3px dashed #f5f5f5;
    background: transparent;
    color: #f5f5f5;
    text-align: center;
    outline: none;
}

input, select {
    font-size: 18px;
    padding: 8px;
    margin: 8px;
    border-radius: 6px;
    border: none;
}

button {
    margin-top: 18px;
    padding: 12px 26px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #2c3e50;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    background: rgba(0,0,0,0.65);
    color: #f5f5f5;
    border-radius: 12px;
    overflow: hidden;
}

th {
    background: #1c2833;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.good { color: #2ecc71 !important; }
.bad  { color: #e74c3c !important; }

@keyframes chalkWrite {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

.chalk { animation: chalkWrite 0.3s ease-out; }
</style>
</head>

<body>

<!-- ACCUEIL -->
<div id="startScreen" class="screen">
    <h1>🧠 Multiplications</h1>
    <select id="difficulty">
        <option value="easy">Facile (1 à 5)</option>
        <option value="medium">Moyen (6 à 8)</option>
        <option value="hard">Difficile (9 à 15)</option>
    </select>
    <br>
    <button onclick="startGame()">▶️ Commencer</button>
</div>

<!-- JEU -->
<div id="gameScreen" class="screen">
    <div class="game-header">
        <span id="timer">⏱ 120 s</span>
        <span id="score">⭐ 0</span>
    </div>

    <div id="game">
        <span id="question"></span>
        <input id="answer" type="tel" inputmode="numeric">
    </div>
</div>

<!-- FIN -->
<div id="endScreen" class="screen">
    <h2 id="finalScore"></h2>

    <!-- ZONE SAUVEGARDE -->
    <div id="saveZone">
        <input id="playerName" placeholder="Prénom">
        <br>
        <button onclick="saveScore()">💾 Enregistrer</button>
    </div>

    <!-- MESSAGE CONFIRMATION -->
    <div id="savedMsg" style="display:none; margin-top:10px; font-size:18px;">
        🎉 Bravo, ton score est enregistré !
    </div>

    <table>
        <thead>
            <tr><th>#</th><th>Prénom</th><th>Score</th></tr>
        </thead>
        <tbody id="scoreTable"></tbody>
    </table>

    <button onclick="show(startScreen)">🔁 Rejouer</button>
</div>

<script>
let score=0,time=120,a,b,len,timer,scoreSaved=false;

const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const endScreen=document.getElementById("endScreen");
const q=document.getElementById("question");
const ans=document.getElementById("answer");
const s=document.getElementById("score");
const t=document.getElementById("timer");
const fs=document.getElementById("finalScore");
const table=document.getElementById("scoreTable");
const saveZone=document.getElementById("saveZone");
const savedMsg=document.getElementById("savedMsg");

function show(el){
    startScreen.style.display="none";
    gameScreen.style.display="none";
    endScreen.style.display="none";
    el.style.display="block";
}

function range(){
    return difficulty.value==="easy"?[1,5]:
           difficulty.value==="medium"?[6,8]:[9,15];
}

function newQ(){
    let [min,max]=range();
    a=Math.floor(Math.random()*(max-min+1))+min;
    b=Math.floor(Math.random()*(max-min+1))+min;
    len=(a*b).toString().length;
    q.textContent=`${a} × ${b} = `;
    q.className="chalk";
    ans.value="";
    ans.focus();
}

function startGame(){
    score=0; time=120; scoreSaved=false;
    s.textContent="⭐ 0";
    t.textContent="⏱ 120 s";
    saveZone.style.display="block";
    savedMsg.style.display="none";
    show(gameScreen);
    newQ();
    clearInterval(timer);
    timer=setInterval(()=>{
        time--;
        t.textContent=`⏱ ${time} s`;
        if(time<=0) endGame();
    },1000);
}

function endGame(){
    clearInterval(timer);
    fs.textContent=`🎉 Score : ${score}`;
    show(endScreen);
    render();
}

ans.addEventListener("input",()=>{
    if(ans.value.length<len) return;
    if(+ans.value===a*b){
        q.className="good";
        score++;
        s.textContent=`⭐ ${score}`;
        setTimeout(newQ,250);
    } else {
        q.className="bad";
        navigator.vibrate?.(200);
        ans.value="";
    }
});

function saveScore(){
    if(scoreSaved) return;
    if(!playerName.value) return alert("Prénom ?");
    let data=JSON.parse(localStorage.getItem("scores")||"[]");
    data.push({name:playerName.value,score});
    localStorage.setItem("scores",JSON.stringify(data));
    scoreSaved=true;
    saveZone.style.display="none";
    savedMsg.style.display="block";
    render();
}

function render(){
    let data=JSON.parse(localStorage.getItem("scores")||"[]");
    data.sort((a,b)=>b.score-a.score);
    table.innerHTML="";
    data.forEach((x,i)=>{
        table.innerHTML+=`<tr><td>${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td>${x.name}</td><td>${x.score}</td></tr>`;
    });
}

show(startScreen);
render();
</script>

</body>
</html>
